# Included only inside the zetahub server block.
location = /cbre {
    if ($http_x_forwarded_proto != "https") {
        return 308 https://$host$request_uri;
    }
    return 302 https://$host/cbre/login;
}

location ^~ /cbre/ {
    if ($http_x_forwarded_proto != "https") {
        return 308 https://$host$request_uri;
    }
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Cloudflare supplies this header through the existing local tunnel.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    # Host-wide transport policy belongs to the shared edge configuration.
    proxy_hide_header Strict-Transport-Security;
    add_header Cache-Control "private, no-store" always;
}
