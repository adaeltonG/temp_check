services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water_local
      POSTGRES_DB: water_control
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - water_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water_control"]
      interval: 5s
      retries: 10
volumes:
  water_data:
